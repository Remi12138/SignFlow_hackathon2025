<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Hand Sign Detection</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        video { border: 2px solid black; }
        canvas { display: none; }
        #prediction { font-size: 24px; font-weight: bold; }

        /* Frame Styling */
        .video-container {
            position: relative;
            display: inline-block;
        }

        .frame-box {
            position: absolute;
            top: 30%; /* Adjust position */
            left: 35%;
            width: 200px; /* Frame width */
            height: 200px; /* Frame height */
            border: 3px solid red; /* Frame color */
        }
    </style>
</head>
<body>

    <h1>ASL Hand Sign Detection</h1>

    <div class="video-container">
        <video id="video" width="640" height="480" autoplay></video>
        <div class="frame-box"></div>  <!-- The red frame -->
    </div>

    <canvas id="canvas" width="640" height="480"></canvas>

    <br><br>
    <button onclick="captureImage()">Predict Sign</button>
    <p id="prediction">Prediction: </p>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');

        // Access the webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => console.error("Error accessing webcam: ", err));

        function captureImage() {
            // Capture the frame from the video
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Get cropped portion (only inside the red box)
            const x = 224;  // X position of the frame
            const y = 144;  // Y position of the frame
            const width = 200;  // Frame width
            const height = 200; // Frame height

            const croppedImage = context.getImageData(x, y, width, height);
            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = width;
            croppedCanvas.height = height;
            const croppedCtx = croppedCanvas.getContext('2d');
            croppedCtx.putImageData(croppedImage, 0, 0);

            // Convert the cropped area to a Base64 string
            const imageData = croppedCanvas.toDataURL('image/jpeg');

            // Send cropped image to Flask for prediction
            fetch('/predict', {
                method: 'POST',
                body: JSON.stringify({ image: imageData }),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('prediction').innerText = "Prediction: " + data.prediction;
            })
            .catch(error => console.error("Error:", error));
        }
    </script>

</body>
</html>
